<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хранение чанков Minecraft — бенчмарк</title>
<style>
  :root {
    --bg:#131110;            /* тёплый графит, без синевы */
    --bg-soft:#171412;
    --panel:#1b1815;
    --panel2:#211d19;
    --line:#2d2823;
    --line2:#453c31;
    --ink:#f4ede3;
    --mut:#a99e8f;
    --mut2:#877c6d;
    --gold:#f0b95c;
    --coral:#f0735a;
    --mint:#5fd3a7;
    --violet:#b594ef;
    --red:#e5635c;
    --ok:#7ed6a5;
    --grad:linear-gradient(135deg, var(--gold), var(--coral));
  }
  * { box-sizing:border-box; }
  html { scrollbar-color: var(--line2) var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    background-image:radial-gradient(1100px 480px at 50% -220px, rgba(240,185,92,.07), transparent 70%); }
  ::selection { background:rgba(240,185,92,.25); }
  a { color:var(--gold); }

  /* центр. колонка: контент не растягивается на весь экран */
  .lw { max-width:1180px; margin-left:auto; margin-right:auto; padding-left:22px; padding-right:22px; }
  header.aw { padding-top:24px; padding-bottom:2px; }

  /* ---------- header / hero ---------- */
  .kicker { display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); font-weight:600; margin-bottom:6px; }
  h1 { margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  h1 em { font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--mut); font-size:12.5px; margin-top:6px; max-width:900px; }
  .sub b { color:var(--ink); font-weight:600; }

  .hero { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:16px; }
  .hero .cell { background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--line);
    border-radius:12px; padding:11px 14px 10px; position:relative; overflow:hidden; }
  .hero .cell::after { content:""; position:absolute; inset:0 0 auto; height:2px; background:var(--grad); opacity:.55; }
  .hero .k { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut2); }
  .hero .v { font-size:20px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .hero .v small { font-size:12px; color:var(--mut); font-weight:400; }
  .hero .cell.accent .v { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ---------- segmented tabs ---------- */
  .tabs { display:flex; gap:4px; margin-top:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; width:max-content; max-width:100%; }
  .tab { padding:6px 14px; border-radius:7px; cursor:pointer; color:var(--mut); font-weight:500;
    font-size:13px; transition:background .15s, color .15s; border:1px solid transparent; }
  .tab:hover { color:var(--ink); }
  .tab.active { background:var(--grad); color:#211812; font-weight:700; box-shadow:0 2px 10px rgba(240,150,92,.25); }

  /* ---------- controls ---------- */
  .controls { display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .controls label { color:var(--mut); font-size:13px; }
  .controls select { background:var(--panel2); color:var(--ink); border:1px solid var(--line2);
    border-radius:8px; padding:5px 10px; font-size:13px; outline:none; cursor:pointer; }
  .controls select:focus { border-color:var(--gold); }

  /* ---------- metric cards ---------- */
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:10px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px 10px;
    position:relative; transition:border-color .15s, transform .15s; }
  .card:hover { border-color:var(--line2); transform:translateY(-1px); }
  .card.lead { border:1px solid transparent; background:
      linear-gradient(var(--panel2), var(--panel2)) padding-box, var(--grad) border-box;
    box-shadow:0 4px 20px rgba(224,140,84,.12); }
  .card .k { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut2); }
  .card .v { font-size:15.5px; font-weight:650; margin-top:3px; line-height:1.3; font-variant-numeric:tabular-nums; }
  .card .v small { display:block; color:var(--mut); font-weight:400; font-size:11.5px; margin-top:2px; }

  /* ---------- panels / charts ---------- */
  .wrap { display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px; margin-bottom:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; margin-bottom:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px 14px;
    min-width:0; }
  .panel h2 { font-size:13.5px; font-weight:650; margin:0 0 4px; line-height:1.35; }
  .panel .hint { color:var(--mut); font-size:12px; margin:0 0 10px; }
  .panel svg { display:block; width:100%; height:auto; }

  /* ---------- table ---------- */
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line2); color:var(--mut2);
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:9px 10px; border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums; vertical-align:top; }
  tbody tr { transition:background .12s; }
  tbody tr:hover { background:rgba(240,185,92,.045); }
  tr:last-child td { border-bottom:none; }
  .adesc { color:var(--mut2); font-size:11.5px; font-weight:400; display:block;
    max-width:52ch; line-height:1.35; margin-top:2px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .fast { background:rgba(95,211,167,.13); color:var(--mint); }
  .balanced { background:rgba(240,185,92,.13); color:var(--gold); }
  .good-compression { background:rgba(181,148,239,.14); color:var(--violet); }
  .ok { color:var(--ok); } .err { color:var(--red); }

  /* ---------- legend / misc ---------- */
  .legend { display:flex; gap:18px; color:var(--mut); font-size:12.5px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .sw { width:12px; height:12px; border-radius:4px; display:inline-block; }
  .sw.circ { border-radius:50%; }
  .note { color:var(--mut2); font-size:12px; margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }

  /* checkbox «сжатие» */
  .chk { display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:var(--mut); font-size:13px; user-select:none; }
  .chk input { width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
  .alglist { display:flex; gap:6px; flex-wrap:wrap; }
  .algchip { display:inline-flex; align-items:center; gap:6px; background:var(--panel2);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 6px;
    font-size:12px; color:var(--mut); cursor:pointer; user-select:none; }
  .algchip input { width:14px; height:14px; accent-color:var(--gold); cursor:pointer; }
  .algchip.off { opacity:.45; text-decoration:line-through; }
  .rubber { fill:rgba(240,185,92,.18); stroke:var(--gold); stroke-width:1; pointer-events:none; }
  .zoomreset { color:var(--gold); cursor:pointer; text-decoration:underline dotted; font-size:12px; margin-left:8px; }

  /* chart element paint classes */
  .cg { stroke:#2b2620; } .ct { fill:#978b7d; }
  .clbl { fill:#f4ede3; pointer-events:none; }
  .panel svg line { pointer-events:none; }
  .panel svg text { pointer-events:none; }
  .penc { fill:var(--gold); } .pdec { fill:var(--violet); }
  .porig { fill:#d8a452; } .pprun { fill:#e0635c; }
  .grp-raw { fill:#9aa0a6; } .grp-rle { fill:var(--mint); }
  .grp-minecraft { fill:var(--gold); } .grp-layered { fill:var(--violet); }
  .grp-other { fill:var(--coral); }
  .sw.grp-raw { background:#9aa0a6; } .sw.grp-rle { background:var(--mint); }
  .sw.grp-minecraft { background:var(--gold); } .sw.grp-layered { background:var(--violet); }
  .sw.grp-other { background:var(--coral); }

  @media (max-width:1180px){ .grid2{grid-template-columns:1fr;} .hero{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .lw{padding-left:14px;padding-right:14px;} h1{font-size:19px;}
    .hero{grid-template-columns:1fr 1fr;} .tabs{width:100%;} .tab{flex:1;text-align:center;} }
</style>
</head>
<body>
<header class="lw">
  <span class="kicker">Benchmark</span>
  <h1>Хранение чанков Minecraft: <em>скорость × размер</em></h1>
  <div class="sub" id="meta">загрузка…</div>
</header>

<div class="hero lw" id="hero"></div>
<div class="tabs lw" id="tabs"></div>
<div class="cards lw" id="cards"></div>
<div class="controls lw" id="controls" style="display:none">
  <label for="metric">Ось X (время):</label>
  <select id="metric">
    <option value="total">encode + decode</option>
    <option value="encode">только encode</option>
    <option value="decode">только decode</option>
  </select>
  <label class="chk"><input type="checkbox" id="gzip"> Сжатие (все методы + deflate)</label>
  <div class="alglist" id="alglist"></div>
  <span class="legend" id="mainlegend"></span>
</div>
<div class="wrap lw" id="charts"></div>
<div class="grid2 lw" id="charts2"></div>
<div class="wrap lw" id="tables"></div>

<script>
const fmt = n => n.toLocaleString('ru-RU');
const fmtKB = b => b >= 1024 ? (b/1024).toFixed(2) + ' KB' : fmt(Math.round(b)) + ' B';
const fmtUs = u => u >= 1000 ? (u/1000).toFixed(2) + ' ms' : u.toFixed(1) + ' µs';
const fmtRatio = r => r >= 100 ? r.toFixed(0) + '×' : r.toFixed(1) + '×';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let REPORT = null, ACTIVE = 0, METRIC = 'total', GZIP = false;
let DISABLED = new Set(); // id базового алгоритма
let ZOOM = null; // {t0,t1,r0,r1} | null

const GROUP_META = {
  raw:       { label: 'RAW', color: '#9aa0a6' },
  rle:       { label: 'RLE', color: 'var(--mint)' },
  minecraft: { label: 'Minecraft', color: 'var(--gold)' },
  layered:   { label: 'Layered', color: 'var(--violet)' },
};
function groupMeta(g){ return GROUP_META[g] || { label: g, color: 'var(--coral)' }; }
function groupCls(g){ return 'grp-' + (GROUP_META[g] ? g : 'other'); }
function baseOf(r){ return r.gzip_extra ? r.id.replace(/\+(deflate\d+|deflate\d+)$/, '') : r.id; }
function vis(d){ return d.results.filter(r => (!r.gzip_extra || GZIP) && !DISABLED.has(baseOf(r))); }

async function init(){
  const r = await fetch('/api/report');
  REPORT = await r.json();
  document.getElementById('meta').innerHTML =
    `миров: <b>${esc(REPORT.world_dirs.join(', '))}</b> · чанков: <b>${fmt(REPORT.max_chunks)}</b> · всего блоков: <b>${fmt(REPORT.total_blocks)}</b> · глобальный список блоков: <b>${fmt(REPORT.global_blocks)}</b> · биомов: <b>${fmt(REPORT.biomes)}</b> · seed: ${REPORT.seed}`;

  const hero = document.getElementById('hero');
  hero.innerHTML = [
    ['миров', esc(REPORT.world_dirs.length)],
    ['чанков в выборке', fmt(REPORT.max_chunks)],
    ['блоков всего', fmt(REPORT.total_blocks)],
    ['глобальный список блоков', fmt(REPORT.global_blocks)],
  ].map(([k, v], i) => `<div class="cell${i === 3 ? ' accent' : ''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const tabs = document.getElementById('tabs');
  REPORT.datasets.forEach((d, i) => {
    const b = document.createElement('div');
    b.className = 'tab' + (i === ACTIVE ? ' active' : '');
    b.textContent = d.label === 'original' ? 'Оригинальные чанки' : 'После удаления невидимых блоков';
    b.onclick = () => { ACTIVE = i; render(); };
    tabs.appendChild(b);
  });
  document.getElementById('metric').onchange = e => { METRIC = e.target.value; render(); };
  document.getElementById('gzip').onchange = e => { GZIP = e.target.checked; render(); };

  // список алгоритмов с галочками (отключение долгих/неинтересных)
  const algRoot = document.getElementById('alglist');
  const baseIds = [...new Set(
    REPORT.datasets.flatMap(d => d.results.filter(r => !r.gzip_extra).map(r => r.id))
  )].sort();
  for (const id of baseIds) {
    const l = document.createElement('label');
    l.className = 'algchip';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => {
      if (cb.checked) DISABLED.delete(id); else DISABLED.add(id);
      l.classList.toggle('off', !cb.checked);
      render();
    };
    l.appendChild(cb);
    l.appendChild(document.createTextNode(id));
    algRoot.appendChild(l);
  }
  render();
}

function timeOf(r){ return METRIC === 'encode' ? r.encode_us_avg : METRIC === 'decode' ? r.decode_us_avg : r.encode_us_avg + r.decode_us_avg; }
function ratioOf(d, r){
  const raw = d.results.find(x => x.id === 'raw');
  if (!raw || !raw.ok) return 1;
  return raw.bytes_avg / Math.max(1e-9, r.bytes_avg);
}

function render(){
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === ACTIVE));
  const d = REPORT.datasets[ACTIVE];
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('mainlegend').innerHTML =
    `<span><span class="sw circ grp-raw"></span>RAW</span>
     <span><span class="sw circ grp-rle"></span>RLE</span>
     <span><span class="sw circ grp-minecraft"></span>Minecraft</span>
     <span><span class="sw circ grp-layered"></span>Layered</span>
     <span style="color:var(--mut2)">(точки окрашены по группе метода)</span>`;
  renderCards(d);
  renderScatter(d);
  renderSizeAcrossDatasets();
  renderTimeBars(d);
  renderRatioBars(d);
  renderTable(d);
}

function renderCards(d){
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  const okRes = vis(d).filter(r => r.ok);
  const bestSize = [...okRes].sort((a, b) => a.bytes_avg - b.bytes_avg)[0];
  const bestEnc = [...okRes].sort((a, b) => a.encode_us_avg - b.encode_us_avg)[0];
  const bestRatio = [...okRes].sort((a, b) => ratioOf(d, b) - ratioOf(d, a))[0];
  const cardDefs = [
    ['лучшее сжатие', bestSize ? `${bestSize.name} · ${fmtKB(bestSize.bytes_avg)}` : '—', '', true],
    ['лучший коэффициент сжатия', bestRatio ? `${bestRatio.id} · ${fmtRatio(ratioOf(d, bestRatio))}` : '—', '', false],
    ['самый быстрый encode', bestEnc ? `${bestEnc.id} · ${fmtUs(bestEnc.encode_us_avg)}` : '—', '', false],
    ['время/размер (raw)', `${fmtUs(okRes.find(r => r.id === 'raw')?.encode_us_avg ?? 0)} · ${fmtKB(d.raw_bytes)}`, '', false],
  ];
  for (const [k, v, s, lead] of cardDefs){
    const c = document.createElement('div');
    c.className = 'card' + (lead ? ' lead' : '');
    c.innerHTML = `<div class="k">${esc(k)}</div><div class="v">${esc(v)} <small>${esc(s)}</small></div>`;
    cards.appendChild(c);
  }
}

// ---------- главный график: scatter (X время, Y коэффициент, лог) ----------
function renderScatter(d){
  const host = document.getElementById('charts');
  host.innerHTML = '';
  const panel = document.createElement('div'); panel.className = 'panel';
  panel.innerHTML = `<span class="kicker">Главный график</span>
    <h2>Коэффициент сжатия (лог-шкала) × время (${METRIC === 'encode' ? 'encode' : METRIC === 'decode' ? 'decode' : 'encode+decode'})</h2>
    <div class="hint">точка = алгоритм (наведите для деталей). Жёлтая линия — фронт лучших: строится от самого быстрого и не опускается вниз (по коэффициенту сжатия). Подписаны только точки фронта. Перетащите мышью по графику, чтобы приблизить область<span class="zoomreset" id="zoomreset">сброс приближения</span></div>`;
  const W = 1120, H = 520, ML = 70, MR = 30, MT = 24, MB = 46;
  const iw = W - ML - MR, ih = H - MT - MB;
  const okRes = vis(d).filter(r => r.ok && r.id !== 'raw');
  const fullT = { min: Math.min(...okRes.map(timeOf)) * 0.8, max: Math.max(...okRes.map(timeOf)) * 1.12 };
  const fullR = { min: Math.min(1, Math.min(...okRes.map(r => ratioOf(d, r))) * 0.75), max: Math.max(...okRes.map(r => ratioOf(d, r))) * 1.15 };
  let maxT = fullT.max, minT = fullT.min, maxR = fullR.max, minR = fullR.min;
  if (ZOOM) {
    minT = Math.max(fullT.min, ZOOM.t0); maxT = Math.min(fullT.max, ZOOM.t1);
    minR = Math.max(fullR.min, ZOOM.r0); maxR = Math.min(fullR.max, ZOOM.r1);
  }
  const x = t => ML + iw * (Math.log(t) - Math.log(minT)) / (Math.log(maxT) - Math.log(minT));
  const y = r => MT + ih * (1 - (Math.log(r) - Math.log(minR)) / (Math.log(maxR) - Math.log(minR)));
  const sizeMax = Math.max(...okRes.map(r => r.bytes_avg));

  // фронт лучших: от самого быстрого к медленному, линия не опускается
  // вниз (коэффициент сжатия не убывает). В frontier попадают точки, которые
  // задают этот «потолок». Подписываются только они.
  const sortedByT = [...okRes].sort((a, b) => timeOf(a) - timeOf(b));
  const topIds = new Set();
  const frontier = [];
  let bestRatio = -1;
  for (const r of sortedByT) {
    const q = ratioOf(d, r);
    if (q >= bestRatio - 1e-9) {
      bestRatio = q;
      topIds.add(r.id);
      frontier.push(r);
    }
  }

  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let g = 0; g <= 5; g++){
    const t = minT * Math.pow(maxT / minT, g / 5);
    const xv = x(t);
    s += `<line x1="${xv}" y1="${MT}" x2="${xv}" y2="${MT+ih}" class="cg"/>`;
    s += `<text x="${xv}" y="${MT+ih+16}" text-anchor="middle" class="ct" font-size="10">${fmtUs(t)}</text>`;
  }
  for (let r = Math.pow(10, Math.ceil(Math.log10(minR))); r <= maxR; r *= 10){
    const yv = y(r);
    if (yv < MT - 2 || yv > MT + ih + 2) continue;
    s += `<line x1="${ML}" y1="${yv}" x2="${W-MR}" y2="${yv}" class="cg"/>`;
    s += `<text x="${ML-8}" y="${yv+4}" text-anchor="end" class="ct" font-size="11">${fmtRatio(r)}</text>`;
  }
  s += `<text x="${ML}" y="${MT-10}" class="ct" font-size="11">коэффициент сжатия (raw / сжатый), лог. шкала</text>`;
  s += `<text x="${W-MR}" y="${H-6}" text-anchor="end" class="ct" font-size="11">время на чанк</text>`;

  // ---- линия фронта лучших (не опускается вниз) ----
  if (frontier.length > 1) {
    const dPath = frontier.map((r, i) =>
      (i === 0 ? 'M' : 'L') + x(timeOf(r)).toFixed(1) + ' ' + y(ratioOf(d, r)).toFixed(1)
    ).join(' ');
    s += `<path d="${dPath}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.8" pointer-events="none"/>`;
  }

  // ---- точки + подписи с анти-наложением ----
  const LAB_H = 11, LAB_GAP = 3;
  const pts = okRes.map(r => {
    const top = topIds.has(r.id);
    const rad = (top ? 1.32 : 1) * (4 + 4 * Math.sqrt(r.bytes_avg / sizeMax));
    const tx = x(timeOf(r)), ty = y(ratioOf(d, r));
    const tw = r.id.length * (top ? 6.2 : 5.6) + 8;
    const side = tx > W - MR - 150 ? 'l' : 'r';
    return {
      r, top, rad, tx, ty, tw, side,
      labelY: ty, hidden: false, pri: ratioOf(d, r),
    };
  });
  // сортируем по приоритету (лучшие выше), чтобы при конфликте прятать худших
  pts.sort((a, b) => b.pri - a.pri);

  const overlap = (a, b) => {
    if (a.hidden || b.hidden || a.side !== b.side) return false;
    const a0 = a.side === 'r' ? a.tx : a.tx - a.tw, a1 = a.side === 'r' ? a.tx + a.tw : a.tx;
    const b0 = b.side === 'r' ? b.tx : b.tx - b.tw, b1 = b.side === 'r' ? b.tx + b.tw : b.tx;
    if (Math.max(a0, b0) > Math.min(a1, b1)) return false;
    return Math.abs(a.labelY - b.labelY) < (LAB_H + LAB_GAP);
  };

  const lx = p => p.side === 'r' ? p.tx + p.rad + 5 : p.tx - p.rad - 5;
  const isTop = p => topIds.has(p.r.id);

  // размещение подписей: продвигаемся по x, каждую подпись опускаем
  // вниз, пока не освободится место; при выходе за низ — пробуем вверх;
  // если некуда — прячем (не-топ в первую очередь)
  const labelSpan = p => {
    const x0 = p.side === 'r' ? lx(p) : lx(p) - p.tw;
    const x1 = p.side === 'r' ? lx(p) + p.tw : lx(p);
    return [x0, x1];
  };
  const xOverlap = (a, b) => {
    const [a0, a1] = labelSpan(a);
    const [b0, b1] = labelSpan(b);
    return a.side === b.side && Math.max(a0, b0) < Math.min(a1, b1);
  };
  // подпись не должна перекрывать ни другие подписи, ни чужие точки
  const clashAt = (placed, p, y) => {
    const [l0, l1] = labelSpan({...p, labelY: y});
    const badLabel = placed.find(q => !q.hidden && xOverlap(q, p) && Math.abs(q.labelY - y) < LAB_H + LAB_GAP);
    if (badLabel) return badLabel;
    return pts.find(q => q !== p && !q.hidden
      && Math.max(l0, q.tx - q.rad) < Math.min(l1, q.tx + q.rad)
      && Math.abs(y - q.ty) < q.rad + 6);
  };

  // попытка разместить подпись с выбранной стороны: сначала вниз, потом вверх
  const tryPlace = (p, side, placed) => {
    const cand = {...p, side};
    let y = p.ty;
    let guard = 0;
    while (clashAt(placed, cand, y)) {
      y += LAB_H + LAB_GAP;
      if (++guard > 80) { y = p.ty; break; }
    }
    if (y <= MT + ih - 4) return y;
    let yu = p.ty;
    let g = 0;
    while (clashAt(placed, cand, yu)) {
      yu -= LAB_H + LAB_GAP;
      if (yu < MT - 2) return null;
      if (++g > 80) return null;
    }
    return yu;
  };

  const sorted = [...pts].sort((a, b) => a.tx - b.tx);
  const placed = [];
  for (const p of sorted) {
    // пробуем обе стороны: сначала «родную» (по горизонту), затем противоположную
    const sides = [p.side, p.side === 'r' ? 'l' : 'r'];
    let done = false;
    for (const side of sides) {
      const y = tryPlace(p, side, placed);
      if (y !== null) {
        p.side = side;
        p.labelY = y;
        placed.push(p);
        done = true;
        break;
      }
    }
    if (!done) {
      if (!isTop(p)) {
        p.hidden = true;
      } else {
        p.labelY = Math.max(MT + 4, p.ty);
        placed.push(p);
      }
    }
  }

  // точки
  pts.forEach(p => {
    const cls = groupCls(p.r.group);
    if (p.top) {
      s += `<circle cx="${p.tx}" cy="${p.ty}" r="${(p.rad + 3).toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="1.2" opacity="0.55" pointer-events="none"/>`;
    }
    s += `<circle cx="${p.tx}" cy="${p.ty}" r="${p.rad.toFixed(1)}" class="${cls}" opacity="0.9">`;
    s += `<title>${esc(p.r.name)}&#10;${esc(p.r.description || '')}&#10;размер ${fmtKB(p.r.bytes_avg)} (коэфф. ${fmtRatio(ratioOf(d, p.r))})&#10;encode ${fmtUs(p.r.encode_us_avg)} + decode ${fmtUs(p.r.decode_us_avg)}</title></circle>`;
  });

  // подписи только у точек фронта (с линиями-привязками)
  pts.forEach(p => {
    if (!p.top || p.hidden) return;
    const x0 = p.side === 'r' ? p.tx + p.rad + 2 : p.tx - p.rad - 2;
    const x1 = lx(p);
    s += `<line x1="${x0}" y1="${p.ty}" x2="${x1}" y2="${p.labelY}" stroke="${groupMeta(p.r.group).color}" stroke-width="1" opacity="0.55"/>`;
    const tx = p.side === 'r' ? x1 + 3 : x1 - 3;
    const anchor = p.side === 'r' ? 'start' : 'end';
    const weight = p.top ? 700 : 400;
    const size = p.top ? 10.5 : 9.5;
    s += `<text x="${tx}" y="${p.labelY + 3.5}" text-anchor="${anchor}" class="clbl" font-size="${size}" font-weight="${weight}">${esc(p.r.id)}</text>`;
  });

  s += '</svg>';
  panel.innerHTML += s;
  host.appendChild(panel);

  // приближение перетаскиванием (область на графике)
  const svgEl = panel.querySelector('svg');
  const zr = document.getElementById('zoomreset');
  if (zr) zr.onclick = () => { ZOOM = null; render(); };
  const toSvg = e => {
    const r = svgEl.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  };
  let drag = null;
  svgEl.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const p = toSvg(e);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('class', 'rubber');
    svgEl.appendChild(rect);
    drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, rect };
    try { svgEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svgEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = toSvg(e);
    drag.x1 = p.x; drag.y1 = p.y;
    const x0 = Math.min(drag.x0, drag.x1), y0 = Math.min(drag.y0, drag.y1);
    drag.rect.setAttribute('x', x0); drag.rect.setAttribute('y', y0);
    drag.rect.setAttribute('width', Math.abs(drag.x1 - drag.x0));
    drag.rect.setAttribute('height', Math.abs(drag.y1 - drag.y0));
  });
  svgEl.addEventListener('pointerup', () => {
    if (!drag) return;
    if (drag.rect) drag.rect.remove();
    const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
    if (w > 8 && h > 8) {
      const ax = Math.min(drag.x0, drag.x1), bx = Math.max(drag.x0, drag.x1);
      const ay = Math.min(drag.y0, drag.y1), by = Math.max(drag.y0, drag.y1);
      const tOf = xv => Math.exp(Math.log(minT) + (xv - ML) / iw * (Math.log(maxT) - Math.log(minT)));
      const rOf = yv => Math.exp(Math.log(minR) + (MT + ih - yv) / ih * (Math.log(maxR) - Math.log(minR)));
      const t0 = Math.max(fullT.min, Math.min(tOf(ax), tOf(bx)));
      const t1 = Math.min(fullT.max, Math.max(tOf(ax), tOf(bx)));
      const r0 = Math.max(fullR.min, Math.min(rOf(ay), rOf(by)));
      const r1 = Math.min(fullR.max, Math.max(rOf(ay), rOf(by)));
      if (t1 - t0 > 1e-9 && r1 - r0 > 1e-9) {
        ZOOM = { t0, t1, r0, r1 };
        render();
      }
    }
    drag = null;
  });
}

// ---------- размер по датасетам (original vs pruned) ----------
function renderSizeAcrossDatasets(){
  const host = document.getElementById('charts2');
  let panel = host.querySelector('.panel.sizechart');
  if (!panel){
    panel = document.createElement('div'); panel.className = 'panel sizechart';
    host.appendChild(panel);
  }
  const orig = REPORT.datasets[0], prun = REPORT.datasets[1];
  const ids = vis(orig).map(r => r.id);
  const W = 720, H = 420, ML = 58, MR = 12, MT = 26, MB = 78;
  const iw = W - ML - MR, ih = H - MT - MB;
  const n = ids.length;
  const maxV = Math.max(...vis(orig).map(r => r.bytes_avg), ...vis(prun).map(r => r.bytes_avg)) * 1.08;
  const x = i => ML + iw * (i + 0.5) / n;
  const yB = v => MT + ih * (1 - v / maxV);
  const bw = Math.max(4, iw / n * 0.32);
  let s = `<span class="kicker">Сравнение датасетов</span>`;
  s += `<h2>Размер на чанк: оригинал vs после удаления невидимых блоков</h2>`;
  s += `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let g = 0; g <= 4; g++){
    const yv = MT + ih * g / 4;
    s += `<line x1="${ML}" y1="${yv}" x2="${W-MR}" y2="${yv}" class="cg"/>`;
    s += `<text x="${ML-6}" y="${yv+4}" text-anchor="end" class="ct" font-size="10">${fmtKB(maxV*(1-g/4))}</text>`;
  }
  ids.forEach((id, i) => {
    const o = vis(orig).find(r => r.id === id), p = vis(prun).find(r => r.id === id);
    s += `<rect x="${x(i)-bw-1}" y="${yB(o.bytes_avg)}" width="${bw}" height="${MT+ih-yB(o.bytes_avg)}" class="porig" opacity="0.88"><title>оригинал ${esc(o.name)}: ${fmtKB(o.bytes_avg)}</title></rect>`;
    s += `<rect x="${x(i)+1}" y="${yB(p.bytes_avg)}" width="${bw}" height="${MT+ih-yB(p.bytes_avg)}" class="pprun" opacity="0.88"><title>после оклюзии ${esc(p.name)}: ${fmtKB(p.bytes_avg)}</title></rect>`;
  });
  const step = Math.max(1, Math.ceil(n / 12));
  ids.forEach((id, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    s += `<text x="${x(i)}" y="${H-MB+16}" text-anchor="middle" class="ct" font-size="9.5">${esc(id)}</text>`;
  });
  s += '</svg>';
  s += `<div class="legend"><span><span class="sw" style="background:#d8a452"></span>оригинал</span>
        <span><span class="sw" style="background:#e0635c"></span>после оклюзии</span></div>`;
  panel.innerHTML = s;
}

// ---------- время: encode vs decode ----------
function renderTimeBars(d){
  const host = document.getElementById('charts2');
  let panel = host.querySelector('.panel.timechart');
  if (!panel){
    panel = document.createElement('div'); panel.className = 'panel timechart';
    host.appendChild(panel);
  }
  const okRes = vis(d).filter(r => r.ok).sort((a, b) => (a.encode_us_avg + a.decode_us_avg) - (b.encode_us_avg + b.decode_us_avg));
  const W = 720, H = 420, ML = 76, MR = 12, MT = 26, MB = 78;
  const iw = W - ML - MR, ih = H - MT - MB;
  const n = okRes.length;
  const maxV = Math.max(...okRes.map(r => r.encode_us_avg + r.decode_us_avg)) * 1.1;
  const x = i => ML + iw * (i + 0.5) / n;
  const yB = v => MT + ih * (1 - v / maxV);
  const bw = Math.max(4, iw / n * 0.32);
  let s = `<span class="kicker">Производительность</span>`;
  s += `<h2>Время на чанк: encode vs decode — ${esc(d.label)}</h2>`;
  s += `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let g = 0; g <= 4; g++){
    const yv = MT + ih * g / 4;
    s += `<line x1="${ML}" y1="${yv}" x2="${W-MR}" y2="${yv}" class="cg"/>`;
    s += `<text x="${ML-6}" y="${yv+4}" text-anchor="end" class="ct" font-size="10">${fmtUs(maxV*(1-g/4))}</text>`;
  }
  okRes.forEach((r, i) => {
    s += `<rect x="${x(i)-bw-1}" y="${yB(r.encode_us_avg)}" width="${bw}" height="${MT+ih-yB(r.encode_us_avg)}" class="penc" opacity="0.9"><title>encode ${esc(r.name)}: ${fmtUs(r.encode_us_avg)}</title></rect>`;
    s += `<rect x="${x(i)+1}" y="${yB(r.decode_us_avg)}" width="${bw}" height="${MT+ih-yB(r.decode_us_avg)}" class="pdec" opacity="0.9"><title>decode ${esc(r.name)}: ${fmtUs(r.decode_us_avg)}</title></rect>`;
  });
  const step = Math.max(1, Math.ceil(n / 12));
  okRes.forEach((r, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    s += `<text x="${x(i)}" y="${H-MB+16}" text-anchor="middle" class="ct" font-size="9.5">${esc(r.id)}</text>`;
  });
  s += '</svg>';
  s += `<div class="legend"><span><span class="sw" style="background:var(--gold)"></span>encode</span>
        <span><span class="sw" style="background:var(--violet)"></span>decode</span></div>`;
  panel.innerHTML = s;
}

// ---------- коэффициент сжатия (бар, лог) ----------
function renderRatioBars(d){
  const host = document.getElementById('charts2');
  let panel = host.querySelector('.panel.ratiochart');
  if (!panel){
    panel = document.createElement('div'); panel.className = 'panel ratiochart';
    host.appendChild(panel);
  }
  const okRes = vis(d).filter(r => r.ok && r.id !== 'raw').sort((a, b) => ratioOf(d, b) - ratioOf(d, a));
  const W = 720, H = 420, ML = 58, MR = 12, MT = 26, MB = 78;
  const iw = W - ML - MR, ih = H - MT - MB;
  const n = okRes.length;
  const maxR = Math.max(...okRes.map(r => ratioOf(d, r))) * 1.15;
  const x = i => ML + iw * (i + 0.5) / n;
  const yB = v => MT + ih * (1 - Math.log10(v) / Math.log10(maxR));
  const bw = Math.max(4, iw / n * 0.45);
  let s = `<span class="kicker">Эффективность</span>`;
  s += `<h2>Коэффициент сжатия (raw / сжатый), лог. шкала — ${esc(d.label)}</h2>`;
  s += `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let r = 1; r <= maxR; r *= 10){
    const yv = yB(r);
    if (yv < MT - 2 || yv > MT + ih + 2) continue;
    s += `<line x1="${ML}" y1="${yv}" x2="${W-MR}" y2="${yv}" class="cg"/>`;
    s += `<text x="${ML-6}" y="${yv+4}" text-anchor="end" class="ct" font-size="10">${fmtRatio(r)}</text>`;
  }
  okRes.forEach((r, i) => {
    const v = ratioOf(d, r);
    const cls = groupCls(r.group);
    s += `<rect x="${x(i)-bw/2}" y="${yB(v)}" width="${bw}" height="${MT+ih-yB(v)}" rx="2" class="${cls}" opacity="0.85"><title>${esc(r.name)}: ${fmtRatio(v)}</title></rect>`;
    s += `<text x="${x(i)}" y="${yB(v)-5}" text-anchor="middle" class="ct" font-size="9.5">${fmtRatio(v)}</text>`;
  });
  const step = Math.max(1, Math.ceil(n / 12));
  okRes.forEach((r, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    s += `<text x="${x(i)}" y="${H-MB+16}" text-anchor="middle" class="ct" font-size="9.5">${esc(r.id)}</text>`;
  });
  s += '</svg>';
  panel.innerHTML = s;
}

function renderTable(d){
  const host = document.getElementById('tables');
  host.innerHTML = '';
  const panel = document.createElement('div'); panel.className = 'panel';
  panel.innerHTML = `<span class="kicker">Таблица</span><h2>Сравнение алгоритмов — ${esc(d.label)}</h2>`;
  const sorted = vis(d).sort((a, b) => a.bytes_avg - b.bytes_avg);
  let html = `<table><thead><tr><th>алгоритм</th><th>группа</th><th>средний размер</th>` +
    `<th>коэфф. сжатия</th><th>encode</th><th>decode</th><th>go</th></tr></thead><tbody>`;
  for (const r of sorted){
    const gm = groupMeta(r.group);
    html += `<tr><td><b>${esc(r.name)}</b><span class="adesc">${esc(r.description || '')}</span></td>
      <td><span class="badge" style="color:${gm.color};background:${gm.color}1f">${esc(gm.label)}</span></td>
      <td><b>${fmtKB(r.bytes_avg)}</b><br><span style="color:var(--mut2);font-size:11px">min ${fmtKB(r.bytes_min)} · max ${fmtKB(r.bytes_max)}</span></td>
      <td>${fmtRatio(ratioOf(d, r))}</td>
      <td>${fmtUs(r.encode_us_avg)}</td>
      <td>${fmtUs(r.decode_us_avg)}</td>
      <td class="${r.ok ? 'ok' : 'err'}">${r.ok ? '✓' : '✗'}</td></tr>`;
  }
  html += '</tbody></table>';
  panel.innerHTML += html;
  const note = document.createElement('div'); note.className = 'note';
  note.textContent = 'время и размер — средние на один чанк; min/max тоже на чанк. Вариант layered-32 кодирует тайлы из 4 чанков (2×2) и выше, поэтому его выигрыш особенно заметен на однородных участках.';
  panel.appendChild(note);
  host.appendChild(panel);
}

init();
</script>
